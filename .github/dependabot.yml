# Dependency updates, monthly, one grouped pull request.
#
# This crate is a library, so updates move Cargo.lock only (lockfile-only): CI then tests against
# current dependencies without raising the minimum versions published in Cargo.toml, which is a
# decision for a release rather than routine churn.
#
# Ignored: x509-ocsp, which comes from git through [patch.crates-io] until its 0.3 release; it moves
# deliberately, and every upstream push would otherwise produce a pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "x509-ocsp"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
